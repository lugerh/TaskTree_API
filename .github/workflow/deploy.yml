on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  run_pull:
    name: run pull
    runs-on: ubuntu-latest

    steps:
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GHACTIONS_HOST }}
          username: ${{ secrets.GHACTIONS_USER }}
          key: ${{ secrets.GHACTIONS_PRIVATE_KEY }}
          port: ${{ secrets.GHACTIONS_PORT }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh 
            cd ${{ secrets.GHACTIONS_WORK_DIR }} 
            git fetch 
            git checkout ${{ secrets.MAIN_BRANCH }} 
            git pull 
            #// bun things
            exit
